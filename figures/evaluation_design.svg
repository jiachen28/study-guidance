<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="585" viewBox="0 0 1050 585"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#295f96"/></marker></defs><rect width="1050" height="585" fill="white"/><text x="50" y="52" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#223952" text-anchor="start">Evaluation design</text><text x="50" y="78" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#597187" text-anchor="start">Project-authored task dataset · held-out analysis · independent human reference labels</text><rect x="65" y="135" width="260" height="90" rx="12" fill="#f5f8fc" stroke="#dce5ef"/><text x="195.0" y="169" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">60 authored scenarios</text><text x="195.0" y="195" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">Four classes; fixed IDs</text><rect x="395" y="135" width="260" height="90" rx="12" fill="#f5f8fc" stroke="#dce5ef"/><text x="525.0" y="169" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">40 development cases</text><text x="525.0" y="195" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">Method and prompt refinement</text><rect x="725" y="135" width="260" height="90" rx="12" fill="#f5f8fc" stroke="#dce5ef"/><text x="855.0" y="169" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">20 held-out cases</text><text x="855.0" y="195" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">Locked evaluation</text><path d="M325 180 L395 180" stroke="#295f96" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M655 180 L725 180" stroke="#295f96" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="65" y="322" width="260" height="100" rx="12" fill="#fff" stroke="#dce5ef"/><text x="195.0" y="356" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">Three human annotators</text><text x="195.0" y="382" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">60 labels per person</text><rect x="395" y="322" width="260" height="100" rx="12" fill="#fff" stroke="#dce5ef"/><text x="525.0" y="356" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">Group adjudication</text><text x="525.0" y="382" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">Discuss disagreements; log reasons</text><rect x="725" y="322" width="260" height="100" rx="12" fill="#fff" stroke="#dce5ef"/><text x="855.0" y="356" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">Model comparison</text><text x="855.0" y="382" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">Baseline / LLM / guarded system</text><path d="M325 372 L395 372" stroke="#295f96" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M655 372 L725 372" stroke="#295f96" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M855 225 L855 322" stroke="#295f96" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="65" y="480" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#597187" text-anchor="start">Primary measures: full-set accuracy, macro F1, prediction coverage and confusion matrices.</text><text x="65" y="504" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#597187" text-anchor="start">Agreement: unanimous proportion and Fleiss’ kappa, with explicit adjudication for disputed scenarios.</text><text x="65" y="551" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="start">This dataset is small and synthetic; outcomes should not be generalised to the student population.</text></svg>