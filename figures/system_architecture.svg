<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="585" viewBox="0 0 1050 585"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#295f96"/></marker></defs><rect width="1050" height="585" fill="white"/><text x="50" y="54" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#223952" text-anchor="start">System architecture</text><text x="50" y="80" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#597187" text-anchor="start">Local task guidance with explicit guardrails and attributable sources</text><rect x="55" y="130" width="280" height="85" rx="12" fill="#f5f8fc" stroke="#dce5ef"/><text x="195.0" y="164" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">Task input</text><text x="195.0" y="190" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">Browser form / JSON request</text><rect x="405" y="130" width="245" height="85" rx="12" fill="#f5f8fc" stroke="#dce5ef"/><text x="527.5" y="164" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">Policy checks</text><text x="527.5" y="190" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">Restrictions + sensitive data</text><rect x="718" y="130" width="275" height="85" rx="12" fill="#f5f8fc" stroke="#dce5ef"/><text x="855.5" y="164" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">Recommendation</text><text x="855.5" y="190" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">Category, tools, safe-use steps</text><path d="M335 172 L405 172" stroke="#295f96" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M650 172 L718 172" stroke="#295f96" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><rect x="85" y="325" width="270" height="100" rx="12" fill="#fff" stroke="#dce5ef"/><text x="220.0" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">TF–IDF retriever</text><text x="220.0" y="385" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">Attributable reference notes</text><rect x="405" y="325" width="245" height="100" rx="12" fill="#fff" stroke="#dce5ef"/><text x="527.5" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">Qwen2.5 3B</text><text x="527.5" y="385" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">Ollama · local structured JSON</text><rect x="718" y="325" width="275" height="100" rx="12" fill="#fff" stroke="#dce5ef"/><text x="855.5" y="359" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#223952" text-anchor="middle">Output renderer</text><text x="855.5" y="385" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="middle">Sources, reasons, verification</text><path d="M540 215 L540 325" stroke="#295f96" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M355 375 L405 375" stroke="#295f96" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M650 375 L718 375" stroke="#295f96" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M855 325 L855 215" stroke="#295f96" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="55" y="485" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#597187" text-anchor="start">The keyword baseline and language-model prediction are recorded separately for evaluation.</text><text x="55" y="507" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#597187" text-anchor="start">Explicitly restricted tasks are set to None by deterministic policy; model output cannot override the restriction.</text><text x="55" y="552" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#597187" text-anchor="start">Student input is processed through the local service; recommendation links refer to publicly accessible guidance.</text></svg>